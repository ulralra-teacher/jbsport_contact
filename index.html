if(G===FT){const M=F.filter(f=>!q||f.join(" ").toLowerCase().includes(q));document.getElementById("cnt").textContent=M.length+"개 표시";document.getElementById("list").innerHTML=M.map(f=>`<div class="c"><span class="n">${esc(f[1])}</span><span class="r">${esc(f[0]+(f[3]?" · "+f[3]:""))}</span><span class="x">내선 ${f[2]}</span></div>`).join("");return}
const L=P.filter(p=>(G==="전체"||p.g===G)&&(!c||p.c===c)&&(!q||(p.n+p.r+p.d+p.a+p.g+p.t+p.e).toLowerCase().includes(q)));
document.getElementById("cnt").textContent=L.length+"명 표시 / 전체 "+P.length+"명";
document.getElementById("list").innerHTML=L.map(p=>{
const full="전북 "+p.a,e=encodeURIComponent(full);
return `<div class="c"><span class="n">${esc(p.n)}</span><span class="r">${esc([p.g,p.r,p.d].filter(Boolean).join(" · "))}</span>${p.e?`<span class="x">내선 ${esc(p.e)}</span>`:"<span></span>"}
${p.t?`<a class="tel" href="tel:${p.t.replace(/-/g,"")}">📞 ${p.t}</a>`:`<span class="s">${U?"연락처 미등재":"🔒"}</span>`}
${p.a?`<div class="ad">🏠 ${esc(p.a)} <a target="_blank" rel="noopener" href="https://map.naver.com/p/search/${e}">네이버지도</a><a target="_blank" rel="noopener" href="https://map.kakao.com/?q=${e}">카카오맵</a></div>`:""}</div>`}).join("")||'<p class="s">검색 결과가 없습니다.</p>'}
document.getElementById("q").oninput=draw;cs.onchange=draw;drawTabs();draw();
</script></body></html>
